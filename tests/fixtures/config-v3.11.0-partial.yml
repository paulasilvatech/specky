# User-authored unversioned workspace config accepted by Specky v3.11.0.
profile: enterprise
templates_path: custom-templates
default_framework: jest
update_check: false
compliance_frameworks: [soc2]
audit_enabled: false
rate_limit:
  enabled: false
  max_requests_per_minute: 137
  burst: 23
audit:
  export_format: otlp
  max_file_size_mb: 42
  fail_closed: false
rbac:
  enabled: false
  default_role: admin
installation:
  permission_profile: prompt
  integrations:
    - github
pipeline:
  require_lgtm: true
